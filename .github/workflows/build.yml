
# =====================================================================
# 一加平板 2 Pro · 显示模式只读探测模块 · 云端编译流程
# 用法见聊天说明：把本文件内容原样粘贴到仓库的 .github/workflows/build.yml，
# 并在仓库根目录上传你之前发给我的 config 文件。提交后会自动开始编译。
# =====================================================================
name: build-pad2pro-probe

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Check device config is present
        run: |
          if [ ! -f config ]; then
            echo "::error::仓库根目录没有 config 文件，请先上传你发给我的 config 文件"
            exit 1
          fi
          wc -l config

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 llvm-18 bc bison flex libssl-dev libelf-dev dwarves python3 perl git make cpio

      - name: Fetch GKI android15-6.6 kernel source
        run: |
          git clone --depth=1 --branch android15-6.6 https://android.googlesource.com/kernel/common ksrc
          head -6 ksrc/Makefile

      - name: Prepare kernel build tree with the device config
        run: |
          set -e
          mkdir -p kout
          cp config kout/.config
          cd ksrc
          ./scripts/config --file ../kout/.config -d WERROR -d TRIM_UNUSED_KSYMS --set-str UNUSED_KSYMS_WHITELIST ""
          make O=../kout ARCH=arm64 LLVM=-18 olddefconfig
          make O=../kout ARCH=arm64 LLVM=-18 modules_prepare -j"$(nproc)"

      - name: Verify layout-critical config options were kept
        run: |
          bad=0
          for k in SMP PREEMPT MODULE_UNLOAD MODVERSIONS MODULE_SIG MODULE_SIG_PROTECT DEBUG_INFO_BTF DEBUG_INFO_BTF_MODULES KALLSYMS CFI_CLANG SHADOW_CALL_STACK ARM64_PTR_AUTH ARM64_BTI TRACEPOINTS STRICT_MODULE_RWX STACKPROTECTOR_STRONG ANDROID_KABI_RESERVE; do
            a=$(grep -E "^(# )?CONFIG_$k[= ]" config | head -1 | sed 's/^# //; s/ is not set/=n/')
            b=$(grep -E "^(# )?CONFIG_$k[= ]" kout/.config | head -1 | sed 's/^# //; s/ is not set/=n/')
            [ -z "$a" ] && a="CONFIG_$k=n"
            [ -z "$b" ] && b="CONFIG_$k=n"
            if [ "$a" = "$b" ]; then echo "ok   $a"; else echo "DIFF $k: device=[$a] build=[$b]"; bad=1; fi
          done
          [ "$bad" = 0 ] || { echo "::error::关键配置项与设备不一致，已停止"; exit 1; }

      - name: Write module sources and symbol CRCs
        run: |
          set -e
          mkdir -p mod
          echo 'obj-m := pad2pro_probe.o' > mod/Kbuild
          cat > mod/pad2pro_probe.c <<'PROBE_C_EOF'
          // SPDX-License-Identifier: GPL-2.0
          /*
           * pad2pro_probe - READ-ONLY probe for OnePlus Pad 2 Pro (msm_drm / SDE DSI).
           * It hooks nothing and writes nothing: it only reads the DSI display mode
           * table from msm_drm's memory and prints the raw words to dmesg.
           *
           * Struct offsets come from static disassembly of msm_drm.ko
           * (6.6.118-android15-8): display->panel = 264, display->modes = 792,
           * panel->num_timing_nodes = 1512, panel->num_display_modes = 1516,
           * sizeof(struct dsi_display_mode) = 208.
           */
          #include <linux/module.h>
          #include <linux/kernel.h>
          #include <linux/init.h>
          #include <linux/moduleparam.h>
          #include <linux/printk.h>

          #define PFX "pad2pro_probe: "

          #define OFF_DISPLAY_PANEL     264UL
          #define OFF_DISPLAY_MODES     792UL
          #define OFF_PANEL_NUM_TIMING  1512UL
          #define OFF_PANEL_NUM_MODES   1516UL
          #define DSI_MODE_SIZE         208UL
          #define MAX_MODES             32U

          static char *pd_addr;
          module_param(pd_addr, charp, 0444);
          MODULE_PARM_DESC(pd_addr, "hex kernel address of msm_drm's static primary_display variable");

          /* kernel pointers: top 16 bits set (true for 39/48-bit VA) and 8-byte aligned */
          static bool ptr_ok(unsigned long a)
          {
          	return (a >> 48) == 0xffffUL && !(a & 7UL);
          }

          static int __init probe_init(void)
          {
          	unsigned long long var_addr;
          	unsigned long display, panel, modes;
          	unsigned int n_timing, n_modes, i;
          	char pfx[40];

          	if (!pd_addr) {
          		pr_err(PFX "missing pd_addr=0x<addr of primary_display>\n");
          		return -EINVAL;
          	}
          	if (kstrtoull(pd_addr, 16, &var_addr) || !ptr_ok((unsigned long)var_addr)) {
          		pr_err(PFX "bad pd_addr '%s'\n", pd_addr);
          		return -EINVAL;
          	}

          	display = READ_ONCE(*(unsigned long *)(unsigned long)var_addr);
          	if (!ptr_ok(display)) {
          		pr_err(PFX "primary_display does not hold a valid pointer: %lx\n", display);
          		return -ENODEV;
          	}
          	panel = READ_ONCE(*(unsigned long *)(display + OFF_DISPLAY_PANEL));
          	modes = READ_ONCE(*(unsigned long *)(display + OFF_DISPLAY_MODES));
          	if (!ptr_ok(panel) || !ptr_ok(modes)) {
          		pr_err(PFX "panel/modes pointers look wrong: panel=%lx modes=%lx\n", panel, modes);
          		return -ENODEV;
          	}
          	n_timing = READ_ONCE(*(unsigned int *)(panel + OFF_PANEL_NUM_TIMING));
          	n_modes = READ_ONCE(*(unsigned int *)(panel + OFF_PANEL_NUM_MODES));
          	if (n_modes == 0 || n_modes > MAX_MODES) {
          		pr_err(PFX "implausible mode count %u (timing nodes %u)\n", n_modes, n_timing);
          		return -ENODEV;
          	}

          	pr_info(PFX "display=%px panel=%px modes=%px num_timing_nodes=%u num_display_modes=%u mode_size=%lu\n",
          		(void *)display, (void *)panel, (void *)modes, n_timing, n_modes, DSI_MODE_SIZE);

          	for (i = 0; i < n_modes; i++) {
          		snprintf(pfx, sizeof(pfx), PFX "m%u ", i);
          		print_hex_dump(KERN_INFO, pfx, DUMP_PREFIX_OFFSET, 16, 4,
          			       (void *)(modes + i * DSI_MODE_SIZE), DSI_MODE_SIZE, false);
          	}
          	pr_info(PFX "done (read-only, nothing modified)\n");
          	return 0;
          }

          static void __exit probe_exit(void)
          {
          }

          module_init(probe_init);
          module_exit(probe_exit);
          MODULE_LICENSE("GPL");
          MODULE_DESCRIPTION("Read-only DSI display mode table probe for msm_drm");
          PROBE_C_EOF
          # Module.symvers: CRCs copied from the device's own msm_drm.ko (__versions table)
          while read -r crc name; do
            printf '%s\t%s\tvmlinux\tEXPORT_SYMBOL\t\n' "$crc" "$name"
          done > kout/Module.symvers <<'SYMVERS_EOF'
          0x4e276f37 module_layout
          0x92997ed8 _printk
          0x2a473df8 param_ops_charp
          0x5c3c7387 kstrtoull
          0x167c5967 print_hex_dump
          0xf0fdf6cb __stack_chk_fail
          0x4829a47e memcpy
          0xdcb764ad memset
          0x656e4a6e snprintf
          SYMVERS_EOF
          cat kout/Module.symvers

      - name: Build module
        run: |
          set -eo pipefail
          REL=6.6.118-android15-8-o-4k
          printf '#define UTS_RELEASE "%s"\n' "$REL" > kout/include/generated/utsrelease.h
          printf '%s' "$REL" > kout/include/config/kernel.release
          make -C ksrc O="$PWD/kout" ARCH=arm64 LLVM=-18 KERNELRELEASE="$REL" M="$PWD/mod" KBUILD_MODPOST_WARN=1 modules 2>&1 | tee build.log
          test -f mod/pad2pro_probe.ko
          llvm-strip-18 --strip-debug mod/pad2pro_probe.ko

      - name: Verify module against the device's own msm_drm.ko
        run: |
          set -e
          ko=mod/pad2pro_probe.ko
          want='vermagic=6.6.118-android15-8-o-4k SMP preempt mod_unload modversions aarch64'
          got=$(strings -a "$ko" | grep '^vermagic=' | head -1)
          echo "got : $got"
          echo "want: $want"
          [ "$got" = "$want" ] || { echo "::error::vermagic 与设备不一致"; exit 1; }
          sz=$(readelf -S -W "$ko" | grep 'gnu.linkonce.this_module' | sed 's/\[ *[0-9]*\]//' | awk '{print $5}')
          echo "struct module section size: 0x$sz (device msm_drm.ko: 0x000600)"
          [ "$sz" = "000600" ] || { echo "::error::struct module 大小与设备不一致"; exit 1; }
          readelf -S -W "$ko" | grep -E '__versions|\.modinfo' || true

      - name: Package
        run: |
          set -e
          mkdir -p out
          cp mod/pad2pro_probe.ko out/
          cat > out/run_probe.sh <<'RUN_SH_EOF'
          #!/system/bin/sh
          # 在平板上用 root 运行：  sh run_probe.sh   （ko 与本脚本放在同一目录）
          # 只读探测：不修改任何显示设置，结果保存到 /sdcard/Download/pad2pro_probe_dmesg.txt
          D=$(cd "$(dirname "$0")" && pwd)
          if [ "$(id -u)" != 0 ]; then echo "需要 root，请先执行 su"; exit 1; fi
          echo 0 > /proc/sys/kernel/kptr_restrict 2>/dev/null
          A=$(grep -w primary_display /proc/kallsyms | grep msm_drm | head -1 | cut -d' ' -f1)
          case "$A" in
            ""|0000000000000000) echo "在 /proc/kallsyms 里找不到 primary_display（msm_drm），把这句话告诉我"; exit 1;;
          esac
          echo "primary_display 地址: $A"
          rmmod pad2pro_probe 2>/dev/null
          if ! insmod "$D/pad2pro_probe.ko" pd_addr=0x$A; then
            echo "insmod 失败，最近的内核日志："
            dmesg | tail -n 30
            exit 1
          fi
          dmesg | grep pad2pro_probe > /sdcard/Download/pad2pro_probe_dmesg.txt
          rmmod pad2pro_probe 2>/dev/null
          echo "完成：把 /sdcard/Download/pad2pro_probe_dmesg.txt 发给我"
          RUN_SH_EOF
          chmod +x out/run_probe.sh
          (cd out && sha256sum pad2pro_probe.ko run_probe.sh | tee SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: pad2pro-probe
          path: out/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: |
            build.log
            kout/.config
          if-no-files-found: ignore
